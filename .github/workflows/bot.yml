name: RUN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:

    - name: "📥 Tải code từ repo Private"
      run: |
         git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Luanbets/MINECRAFT.git bot

    - name: "⚙️ Cài Node.js 18"
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: "📦 Cài thư viện"
      working-directory: bot
      run: npm install

    - name: "🔀 Đổi IP qua Cloudflare WARP"
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        warp-cli --accept-tos register
        warp-cli --accept-tos connect
        sleep 5

    - name: "🤖 Chạy bot"
      working-directory: bot
      run: npm start
